# Render Blueprint — FREE plan, no credit card.
# One web service builds the client and serves it from Express (same origin:
# first-party cookies work on iOS Safari; WebSockets share the host).
#
# Free-plan notes:
#  - The disk is wiped on every restart/deploy, so media MUST go to Cloudinary
#    (STORAGE_DRIVER=cloudinary makes the app refuse to start without it).
#  - The service sleeps after 15 min without traffic; an UptimeRobot monitor on
#    /api/health every 5 minutes keeps it awake (fits in 750 free hours/month).
#  - Use BREVO_API_KEY for email: free instances may block SMTP ports.
# Variables marked `sync: false` are entered in the Render dashboard.
services:
  - type: web
    name: duo
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --include=dev --ignore-scripts && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: SERVE_CLIENT
        value: "true"
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: VITE_APP_NAME
        value: Duo
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: AUTHORIZED_USER_1_EMAIL
        sync: false
      - key: AUTHORIZED_USER_2_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: TURN_SERVER_URL
        sync: false
      - key: TURN_SERVER_USERNAME
        sync: false
      - key: TURN_SERVER_CREDENTIAL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: LOGIN_ALERT_ACCOUNTS
        sync: false
      - key: LOGIN_ALERT_TO
        sync: false
      - key: LOGIN_ALERT_MODE
        value: both
      - key: ALERT_TIME_ZONE
        value: Asia/Kolkata
